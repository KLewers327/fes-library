<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://kit.fontawesome.com/5a95f7f5fa.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <!-- BODY -->

  <body>
    <section id="landing">
      <!-- NAVIGATION BAR -->

      <nav>
        <div class="nav__container">
          <img class="logo" src="./assets/Library.svg" alt="Library logo" />
          <ul class="nav__links">
            <li><a href="#" class="nav__link">Home</a></li>
            <li><a href="#" class="nav__link">Contact</a></li>
            <li><a href="#" class="nav__link nav__link--primary">Books</a></li>
          </ul>
        </div>
      </nav>

      <!-- HEADER -->

      <header>
        <div class="header__container">
          <div class="header__description">
            <h1>America's most awarded online library platform</h1>
            <h2>
              Find your dream book with <span class="purple">Library</span>
            </h2>
            <button class="btn">Browse books</button>
          </div>
          <figure class="header__img--wrapper">
            <img
              src="./assets/Undraw_Books.svg"
              alt="girl reading while sitting on stack of books"
            />
          </figure>
        </div>
      </header>
    </section>

    <!-- MAIN -->

    <main>
      <section id="highlights">
        <div class="container">
          <div class="row">
            <h2 class="section__title">
              Why choose <span class="purple">Library</span>
            </h2>
            <div class="highlight__wrapper">
              <div class="highlight">
                <div class="highlight__img">
                  <i class="fa-sharp fa-solid fa-bolt"></i>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <!-- <section id="features">
        <div class="container">
          <div class="row">

          </div>
        </div>
      </section>
      <section id="recent">
        <div class="container">
          <div class="row">

          </div>
        </div>
      </section> -->
    </main>
  </body>
</html>
